<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>nightly build</title>
    <style>
      /*
       * Neon/vaporwave HUD — see plan.md and doc/adr/0003-visual-direction.md.
       * These custom properties are the CSS half of the single colour source
       * in client/src/palette.ts; main.ts calls applyPaletteCssVars() at
       * startup and overwrites every one of them from that file. The literal
       * values below exist only so there's no flash of unstyled colour in the
       * instant before that module script runs — keep them identical to
       * palette.ts or that guarantee breaks.
       */
      :root {
        --void: #0d0221;
        --surface: #241b2f;
        --raised: #262335;
        --magenta: #ff2a6d;
        --pink: #ff7edb;
        --cyan: #05d9e8;
        --laserCyan: #36f9f6;
        --purple: #7b2fbe;
        --violet: #8c52ff;
        --lavender: #b967ff;
        --orange: #ff8b39;
        --gold: #fede5d;
        --red: #fe4450;
        --mint: #72f1b8;
        --hotWhite: #fff5f6;
        --lilac: #848bbd;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--hotWhite);
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        /* A swipe across the road steers (see main.ts's steer()). Without this
           the browser claims horizontal drags first — scroll, overscroll glow,
           and the edge swipe that navigates back — and the page never sees the
           gesture at all. */
        touch-action: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: 16px;
        box-sizing: border-box;
      }
      #hud > * {
        pointer-events: auto;
      }
      /* Readouts, not controls. A swipe only starts on the canvas, so anything
         up here that claims pointer events is a patch of road you cannot steer
         from — same reasoning as #ghostLabels below, which was caught doing
         exactly that to the day buttons. */
      #logo,
      #score {
        pointer-events: none;
      }

      /* ---- non-interactive overlays: scanlines + vignette ----
         Both live inside #hud (not as separate fixed elements) so they pick
         up its pointer-events:none without needing their own rule, and both
         stay well under any photosensitivity threshold: no element here
         flashes — "scanlineDrift" is a slow, continuous scroll, not a strobe,
         and "tubeFlicker" (used sparingly, below) varies opacity gently over
         several seconds, nowhere near WCAG 2.3.1's 3-flashes-per-second
         ceiling. Both are fully disabled under prefers-reduced-motion. */
      #scanlines {
        pointer-events: none !important;
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.14) 0px,
          rgba(0, 0, 0, 0.14) 1px,
          transparent 1px,
          transparent 3px
        );
        background-size: 100% 3px;
        mix-blend-mode: overlay;
        opacity: 0.5;
        animation: scanlineDrift 9s linear infinite;
        z-index: 1;
      }
      #vignette {
        pointer-events: none !important;
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(13, 2, 33, 0.55) 100%);
        z-index: 1;
      }
      @keyframes scanlineDrift {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 300px;
        }
      }
      @keyframes tubeFlicker {
        0%,
        92%,
        100% {
          opacity: 1;
        }
        93% {
          opacity: 0.82;
        }
        94% {
          opacity: 1;
        }
        96% {
          opacity: 0.88;
        }
        97% {
          opacity: 1;
        }
      }
      .flicker {
        animation: tubeFlicker 7s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #scanlines {
          animation: none;
        }
        .flicker {
          animation: none !important;
        }
      }

      /* ---- the archive's wordmark — decorative, so it's aria-hidden and
         never carries information the score/day controls don't already ----
         A pre-rendered neon logo (client/logo.png), already cut out to a
         transparent background (see the note beside its source), so the only
         job left here is sizing and the same glow every other neon element
         gets from a drop-shadow stack. */
      #logo {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        height: 64px;
        width: auto;
        filter: drop-shadow(0 1px 1px rgba(5, 1, 20, 0.9)) drop-shadow(0 0 10px rgba(255, 42, 109, 0.55))
          drop-shadow(0 0 20px rgba(5, 217, 232, 0.3));
        user-select: none;
      }
      /* Purely decorative (aria-hidden, and the page <title> already carries
         the name) — at phone widths it has nowhere to go without colliding
         with the score or the day control, so it's the thing that gives up
         the space, not either of those two. */
      @media (max-width: 480px) {
        #logo {
          display: none;
        }
      }

      /* ---- the score: the HUD's one piece of load-bearing information, so
         it gets the brightest, highest-contrast treatment (gold fill,
         18.8:1-equivalent hotWhite core) rather than the flashiest one ----
         Layered text-shadow: a tight near-black contact shadow keeps the
         glyph edge crisp, then a mid halo in the hue, then a wide dim one —
         three tiers, not one big blur, or it reads as a smudge. */
      #score {
        position: absolute;
        top: 16px;
        left: 16px;
        font-size: 30px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--gold);
        text-shadow:
          0 0 2px rgba(10, 5, 0, 0.9),
          0 0 6px var(--gold),
          0 0 14px rgba(254, 222, 93, 0.6),
          0 0 28px rgba(254, 222, 93, 0.25);
      }

      #day {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        border: 1px solid color-mix(in srgb, var(--cyan) 35%, transparent);
        border-radius: 999px;
        padding: 6px 8px;
        backdrop-filter: blur(6px);
      }
      #dayLabel {
        color: var(--pink);
        min-width: 4.5em;
        text-align: center;
      }
      #day button {
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--cyan) 55%, transparent);
        color: var(--cyan);
        border-radius: 999px;
        width: 26px;
        height: 26px;
        line-height: 1;
        cursor: pointer;
        font-size: 14px;
        transition:
          box-shadow 0.15s ease,
          color 0.15s ease;
      }
      #day button:not(:disabled):hover {
        color: var(--hotWhite);
        box-shadow: 0 0 10px var(--cyan);
      }
      #day button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--laserCyan);
        outline-offset: 2px;
      }

      /* ---- ghost name tags — see ghosts.ts; projected into screen space
         every frame, so position is set via `transform`, never layout ---- */
      #ghostLabels {
        /* A full-screen overlay holding the projected ghost name tags. It is a
           direct child of #hud, so `#hud > * { pointer-events: auto }` was
           turning the whole viewport into a click target and swallowing the
           day-selector buttons underneath it — the labels are readouts, never
           click targets, so it opts back out exactly like #scanlines and
           #vignette above. Caught by elementFromPoint: a scripted .click()
           bypasses hit-testing and passed right through this for weeks. */
        pointer-events: none !important;
        position: absolute;
        inset: 0;
      }
      .ghost-label {
        position: absolute;
        top: 0;
        left: 0;
        transform: translate(-50%, -100%);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--pink); /* lavender text fails small-text contrast; pink is the same family at 8.8:1 */
        text-shadow:
          0 0 2px rgba(10, 0, 20, 0.9),
          0 0 6px var(--lavender),
          0 0 16px rgba(185, 103, 255, 0.5);
        white-space: nowrap;
      }

      .panel {
        background: color-mix(in srgb, var(--raised) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--violet) 45%, transparent);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.4) inset,
          0 0 40px rgba(123, 47, 190, 0.25);
      }

      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 1, 14, 0.7);
      }
      /* The browser's own [hidden] { display: none } rule loses to the
         .modal rule above (author CSS beats the UA stylesheet whenever both
         set `display`, regardless of selector specificity) — so toggling
         .hidden in JS silently did nothing without this override. Found by
         actually rendering the page; see plan.md / PROCESS.md. */
      .modal[hidden] {
        display: none;
      }
      .modal form {
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 260px;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
      }
      .modal form label {
        color: var(--lilac);
        font-size: 14px;
      }
      .modal input {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent);
        background: var(--void);
        color: var(--hotWhite);
        font-size: 16px;
      }
      .modal input:focus-visible {
        outline: 2px solid var(--laserCyan);
        outline-offset: 1px;
      }
      .modal button[type="submit"] {
        padding: 10px 14px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, var(--magenta), var(--violet));
        color: var(--hotWhite);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(255, 42, 109, 0.45);
        transition: box-shadow 0.15s ease;
      }
      .modal button[type="submit"]:hover {
        box-shadow: 0 0 28px rgba(255, 42, 109, 0.65);
      }
      .modal button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: default;
        box-shadow: none;
      }
      #usernameError {
        color: var(--red);
        font-size: 13px;
        min-height: 1em;
      }

      #crashed {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        padding: 28px 32px;
      }
      #crashedText {
        font-size: 20px;
        font-weight: 700;
        color: var(--red);
        text-shadow:
          0 0 2px rgba(10, 0, 0, 0.9),
          0 0 8px var(--red),
          0 0 20px rgba(254, 68, 80, 0.5);
      }
      #crashed button {
        margin-top: 16px;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--cyan) 55%, transparent);
        background: color-mix(in srgb, var(--cyan) 12%, transparent);
        color: var(--laserCyan);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 0 16px rgba(5, 217, 232, 0.35);
        transition: box-shadow 0.15s ease;
      }
      #crashed button:hover {
        box-shadow: 0 0 26px rgba(5, 217, 232, 0.55);
      }

      /* Low-spec / "this is too much" fallback — drops the post-processing
         composer back to a plain render (see postfx.ts). Deliberately small
         and out of the way: it's an escape hatch, not a feature. */
      #fxToggle,
      #soundToggle {
        position: absolute;
        bottom: 16px;
        right: 16px;
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        border: 1px solid color-mix(in srgb, var(--lilac) 40%, transparent);
        color: var(--lilac);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      #fxToggle[aria-pressed="true"],
      #soundToggle[aria-pressed="true"] {
        color: var(--cyan);
        border-color: color-mix(in srgb, var(--cyan) 55%, transparent);
      }
      /* Sits immediately left of the effects pill. Offset rather than a flex
         row because both were already absolutely positioned to the corner. */
      #soundToggle {
        right: 142px;
      }
      /* ---- the day's leaderboard ----
         Ranked standings for the day. This project refused a leaderboard for a
         long time and argued the case in README.md; doc/adr/0009-leaderboard.md
         is where that was reversed, superseding 0007 and 0008.

         Sized to its content and anchored to one corner — deliberately NOT
         inset:0. #ghostLabels was a full-screen child of #hud and silently ate
         every click on the day selector; anything added here inherits
         pointer-events:auto from `#hud > *` the same way, so it must never
         cover ground it doesn't draw on. */
      #leaderboard {
        position: absolute;
        left: 16px;
        top: 72px;
        width: 190px;
        max-width: calc(100vw - 32px);
        font-size: 12px;
      }
      #leaderboard details {
        background: color-mix(in srgb, var(--surface) 72%, transparent);
        border: 1px solid color-mix(in srgb, var(--cyan) 26%, transparent);
        border-radius: 8px;
        padding: 8px 10px;
        backdrop-filter: blur(3px);
      }
      #leaderboard summary {
        cursor: pointer;
        color: var(--lilac);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        list-style: none;
      }
      #leaderboard summary::-webkit-details-marker {
        display: none;
      }
      #leaderboard summary::after {
        content: " ▾";
        opacity: 0.6;
      }
      #leaderboard details[open] summary::after {
        content: " ▴";
      }
      .leaderboard-count {
        color: var(--cyan);
        font-weight: 700;
      }
      .leaderboard-empty {
        margin: 8px 0 0;
        color: var(--lilac);
        opacity: 0.75;
      }
      .leaderboard-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        max-height: 46vh;
        overflow-y: auto;
      }
      .leaderboard-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 3px 0;
      }
      .leaderboard-rank {
        color: var(--lilac);
        font-variant-numeric: tabular-nums;
        min-width: 1.6em;
        text-align: right;
        flex: none;
      }
      /* The top three carry the warm end of the palette — gold, then the two
         metals read as cooler. Nothing else in the scene uses gold, so it
         stays legible as "first" rather than as decoration. */
      .leaderboard-row:nth-child(1) .leaderboard-rank {
        color: var(--gold);
      }
      .leaderboard-row:nth-child(2) .leaderboard-rank,
      .leaderboard-row:nth-child(3) .leaderboard-rank {
        color: var(--hotWhite);
      }
      /* Lavender is the ghosts' colour everywhere else in the scene, but it
         fails small-text contrast — pink is the same family at 8.8:1, the same
         substitution .ghost-label already makes. */
      .leaderboard-name {
        color: var(--pink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
      }
      .leaderboard-distance {
        color: var(--hotWhite);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      /* Your own run. Marked wherever it appears — inside the ten or below the
         gap — so the row means the same thing in both places. */
      .leaderboard-row.is-you .leaderboard-name,
      .leaderboard-row.is-you .leaderboard-distance {
        color: var(--mint);
      }
      .leaderboard-you {
        color: var(--lilac);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-left: 4px;
      }
      /* The break between the ten and your own row further down. */
      .leaderboard-gap {
        color: var(--lilac);
        opacity: 0.5;
        text-align: center;
        letter-spacing: 0.3em;
        padding: 2px 0;
      }

      /* On a phone it becomes a disclosure near the top instead of a side
         panel, which would otherwise sit over the road. leaderboard.ts drives the
         open/closed state off the same breakpoint. */
      @media (max-width: 700px) {
        #leaderboard {
          left: 16px;
          right: 16px;
          top: 76px;
          width: auto;
          max-width: none;
        }
        /* Nearly opaque here, unlike the desktop panel: opened, this sits over
           the wrapped logo, and at 72% the text behind it showed through and
           read as clutter. */
        #leaderboard details {
          background: color-mix(in srgb, var(--surface) 94%, transparent);
        }
        .leaderboard-list {
          max-height: 38vh;
        }
      }

    </style>
  </head>
  <body>
    <div id="hud">
      <div id="scanlines"></div>
      <div id="vignette"></div>
      <img id="logo" class="flicker" src="/logo.png" alt="" aria-hidden="true" />
      <div id="score">0 m</div>
      <div id="day">
        <button id="prevDay" aria-label="previous day">&larr;</button>
        <span id="dayLabel">today</span>
        <button id="nextDay" aria-label="next day">&rarr;</button>
      </div>
      <section id="leaderboard" aria-label="today's leaderboard">
        <details>
          <summary>
            leaderboard <span class="leaderboard-count">0</span>
          </summary>
          <p class="leaderboard-empty">nobody has driven this day yet</p>
          <ul class="leaderboard-list" hidden></ul>
        </details>
      </section>
      <div id="ghostLabels"></div>
      <div id="crashed" class="panel" hidden>
        <div id="crashedText"></div>
        <button id="restart">drive again</button>
      </div>
      <button id="soundToggle" type="button" aria-pressed="false">mute sound</button>
      <button id="fxToggle" type="button" aria-pressed="false">reduce effects</button>
    </div>
    <div id="usernameModal" class="modal" hidden>
      <form id="usernameForm" class="panel">
        <label for="username">pick a name &mdash; this is who your ghost will be</label>
        <input id="username" name="username" maxlength="24" required autofocus />
        <button type="submit">start driving</button>
        <div id="usernameError"></div>
      </form>
    </div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
